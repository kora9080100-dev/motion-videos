# Keeps the game's libraries up to date. Security fixes arrive as soon as they are
# published; routine updates are bundled into one monthly pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /catch-the-liar
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
