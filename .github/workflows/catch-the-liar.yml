name: catch-the-liar

on:
  push:
    paths: ['catch-the-liar/**', '.github/workflows/catch-the-liar.yml']
  pull_request:
    paths: ['catch-the-liar/**', '.github/workflows/catch-the-liar.yml']

defaults:
  run:
    working-directory: catch-the-liar

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catch-the-liar/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit + integration tests (embedded database)
        run: npm test
      - name: Integration tests (PostgreSQL)
        run: npx vitest run tests/integration.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build
      - name: End-to-end (4 browsers play a full round)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_ENV=production PORT=3000 node dist/server/index.js &
          npx --yes wait-on http://localhost:3000/healthz
          BASE_URL=http://localhost:3000 node e2e/play.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: catch-the-liar/e2e/screenshots
